# PUBLIC — security reports. Runs on push to main, weekly, via workflow_call (merge-gate), and manually.
name: Security

on:
  push:
    branches: [ main ]
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'   # every Monday at 03:00 UTC

jobs:
  security:
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-security-reports.yml@v2.7.1
    with:
      java-version: '21'
    secrets: inherit
